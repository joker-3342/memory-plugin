<!-- 启动引导（SPEC 11.1） -->

<ol class="mp-muted">
  <li>Step 1　新建世界（可用「应用模板」：仙侠小千 / 主神空间 / 都市低魔）</li>
  <li>Step 2　建主角（姓名、人格锚点、初始位置）</li>
  <li>Step 3　建首个 NPC（姓名、一句话锚点、初始关系）</li>
  <li>Step 4　导入世界书（可选）</li>
  <li>Step 5　完成，生成首个场景</li>
</ol>

<p class="mp-muted">
  插件启动时会<b>自动探测后端</b>并把「世界 ID」默认取为<b>当前角色卡名</b>，一般无需手填；
  点「初始化世界」即可按当前世界 ID 建好记录。若自动探测失败，再手动填后端地址即可。
</p>

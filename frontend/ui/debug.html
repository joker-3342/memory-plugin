<!-- 调试面板：上次注入详情、token 分布、警告、队列、日志 -->
<div class="mp-row">
  <button id="mp-refresh-debug" class="menu_button">刷新注入详情</button>
  <button id="mp-refresh-jobs" class="menu_button">刷新队列</button>
  <button id="mp-refresh-logs" class="menu_button">拉取日志</button>
  <button id="mp-refresh-errors" class="menu_button">拉取错误日志</button>
</div>
<pre id="mp-debug-dump" class="mp-dump">（尚无注入记录）</pre>
<pre id="mp-jobs-dump" class="mp-dump">（尚未拉取队列状态）</pre>
<pre id="mp-log-dump" class="mp-dump">（点「拉取日志」查看最近 200 行；「拉取错误日志」只看 ERROR + 堆栈）</pre>
